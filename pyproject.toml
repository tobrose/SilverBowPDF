[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butterpdf"
version = "0.1.0"
description = "Desktop PDF viewer and editor"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pypdfium2>=4.30",
    "pikepdf>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
butterpdf = "pdfapp.__main__:main"

[tool.setuptools]
packages = ["pdfapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
