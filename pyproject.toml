[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "silverbowpdf"
dynamic = ["version"]
description = "Desktop PDF viewer and editor"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pypdfium2>=4.30",
    "pikepdf>=8.0",
    # Windows' own OCR engine (Tools > Recognize Text). ~3MB; the engine and
    # its languages come with Windows.
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
silverbowpdf = "pdfapp.__main__:main"

[tool.setuptools]
packages = ["pdfapp"]

[tool.setuptools.package-data]
pdfapp = ["icon.png"]

[tool.setuptools.dynamic]
version = {attr = "pdfapp.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
